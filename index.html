<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3ADALA | Excellence Juridique Marocaine</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Montserrat:wght@300;600&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --navy: #0a192f; /* Bleu nuit profond */
            --gold: #b89552; /* Or satiné */
            --slate: #455a64; 
            --bg: #ffffff; 
            --nav-height: 75px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: 'Montserrat', sans-serif;
            background: var(--bg); 
            margin: 0; 
            color: var(--navy);
        }

        /* --- LOGO DESIGN --- */
        .logo-container {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(184, 149, 82, 0.3);
        }

        .logo-main {
            font-family: 'Cinzel', serif; /* Style "Luxe/Juridique" */
            font-size: 1.4rem;
            letter-spacing: 4px;
            color: var(--gold);
            display: block;
            margin-bottom: 5px;
        }

        .logo-sub {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.6rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #ffffff;
            opacity: 0.8;
        }

        /* --- NAVIGATION --- */
        .sidebar { background: var(--navy); color: white; position: fixed; z-index: 1000; }

        @media (min-width: 769px) {
            .sidebar { width: 300px; height: 100vh; padding: 50px 30px; display: flex; flex-direction: column; left: 0; top: 0; }
            .main-content { margin-left: 300px; padding: 80px; }
            .nav-item { padding: 18px; margin: 12px 0; display: flex; align-items: center; gap: 15px; border-radius: 4px; cursor: pointer; transition: 0.3s; font-size: 0.85rem; letter-spacing: 1px; text-transform: uppercase; }
        }

        @media (max-width: 768px) {
            .sidebar { bottom: 0; left: 0; width: 100%; height: var(--nav-height); display: flex; justify-content: space-around; align-items: center; background: var(--navy); }
            .logo-container { display: none; }
            .main-content { padding: 30px; padding-bottom: 120px; }
            .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 0.65rem; font-weight: 600; color: #a5b1c2; }
            .nav-item.active { color: var(--gold); }
            .nav-item i { font-size: 1.2rem; margin-bottom: 4px; }
        }

        .nav-item:hover { color: var(--gold); }
        .nav-item.active { background: rgba(184, 149, 82, 0.1); border-left: 3px solid var(--gold); color: var(--gold); }
        @media (max-width: 768px) { .nav-item.active { border-left: none; background: none; } }

        /* --- CARDS & TITRES --- */
        .card { 
            background: #fff; border-radius: 2px; padding: 45px; 
            box-shadow: 0 15px 45px rgba(0,0,0,0.03); 
            margin-bottom: 30px; border: 1px solid #f0f0f0;
        }

        h3 { 
            font-family: 'Cinzel', serif;
            margin-top: 0; color: var(--navy); font-size: 1.2rem; font-weight: 700; 
            letter-spacing: 1px; margin-bottom: 40px; text-align: center;
        }

        /* --- FORMULAIRES --- */
        label { display: block; margin-bottom: 12px; font-weight: 600; font-size: 0.75rem; text-transform: uppercase; color: var(--gold); letter-spacing: 1.5px; }
        input, select, textarea { 
            width: 100%; padding: 18px; margin-bottom: 30px; 
            border: 1px solid #e2e8f0; border-radius: 0; 
            font-size: 0.95rem; background: #fafafa;
        }
        input:focus { border-color: var(--gold); outline: none; background: #fff; }

        button { 
            background: var(--navy); color: white; border: 1px solid var(--gold); 
            padding: 20px; border-radius: 0; width: 100%; 
            font-weight: 600; font-size: 0.8rem; cursor: pointer;
            text-transform: uppercase; letter-spacing: 3px; transition: 0.4s;
        }
        button:hover { background: var(--gold); color: var(--navy); }

        .result-area { 
            margin-top: 40px; padding: 30px; border: 1px double var(--gold);
            display: none; text-align: center; background: #fff;
        }

        /* Header Mobile Logo */
        .header-mobile {
            display: none;
            padding: 25px; text-align: center; background: var(--navy);
            color: var(--gold); font-family: 'Cinzel', serif; letter-spacing: 3px; font-size: 1rem;
        }
        @media (max-width: 768px) { .header-mobile { display: block; } }

    </style>
</head>
<body>

    <div class="header-mobile">3ADALA</div>

    <div class="sidebar">
        <div class="logo-container">
            <span class="logo-main">3ADALA</span>
            <span class="logo-sub">POURTOUS.MA</span>
        </div>
        
        <div class="nav-item active" onclick="showTab('tab-calc', this)">
            <i class="fas fa-calculator"></i> <span class="nav-text">Simulateur</span>
        </div>
        <div class="nav-item" onclick="showTab('tab-conseil', this)">
            <i class="fas fa-fingerprint"></i> <span class="nav-text">Audit IA</span>
        </div>
        <div class="nav-item" onclick="showTab('tab-docs', this)">
            <i class="fas fa-file-contract"></i> <span class="nav-text">Documents</span>
        </div>
    </div>

    <div class="main-content">
        <div id="tab-calc" class="tab-content active-section">
            <div class="card">
                <h3>Calcul des Indemnités</h3>
                <label>Salaire Brut de Référence (MAD)</label>
                <input type="number" id="salary" inputmode="numeric" placeholder="Montant mensuel">
                
                <label>Années de Service</label>
                <input type="number" id="seniority" inputmode="numeric" placeholder="Nombre d'années complètes">

                <label>Nature du Départ</label>
                <select id="reason">
                    <option value="licenciement">Licenciement Institutionnel</option>
                    <option value="demission">Démission Volontaire</option>
                </select>

                <button onclick="calculateRights()">Exécuter l'Analyse</button>
                <div id="res-calc" class="result-area"></div>
            </div>
        </div>

        <div id="tab-conseil" class="tab-content">
            <div class="card">
                <h3>Intelligence Conformité</h3>
                <label>Exposé des faits juridiques</label>
                <textarea id="ai-question" rows="5" placeholder="Décrivez votre situation contractuelle..."></textarea>
                <button onclick="askAdvice()">Solliciter l'IA</button>
                <div id="res-advice" class="result-area"></div>
            </div>
        </div>

        <div id="tab-docs" class="tab-content">
            <div class="card">
                <h3>Génération Documentaire</h3>
                <label>Nom complet du titulaire</label>
                <input type="text" id="user-name" placeholder="IDENTITÉ OFFICIELLE">
                <button onclick="generateDoc()">Éditer le certificat (PDF)</button>
            </div>
        </div>
    </div>

<script>
    function showTab(tabId, element) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active-section'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById(tabId).classList.add('active-section');
        element.classList.add('active');
    }

    function calculateRights() {
        const s = parseFloat(document.getElementById('salary').value);
        const y = parseFloat(document.getElementById('seniority').value);
        const r = document.getElementById('reason').value;
        const res = document.getElementById('res-calc');

        if(!s || !y) return;

        res.style.display = "block";
        if(r === "demission") {
            res.innerHTML = "<p style='font-size:0.85rem; letter-spacing:1px;'>Aucune indemnité compensatrice n'est due dans ce scénario.</p>";
        } else {
            const h = s / 191;
            let t = (y <= 5) ? (96*h*y) : (y <= 10) ? (96*h*5 + 144*h*(y-5)) : (96*h*5 + 144*h*5 + 192*h*(y-10));
            res.innerHTML = `<span style="font-size: 0.7rem; color: var(--gold); letter-spacing: 2px;">RÉSULTAT DE L'AUDIT</span><br><span style="font-size: 1.6rem; color: var(--navy); font-weight: 700;">${Math.round(t).toLocaleString()} MAD</span>`;
        }
    }

    function askAdvice() {
        const res = document.getElementById('res-advice');
        res.style.display = "block";
        res.innerHTML = "<em>Traitement algorithmique...</em>";
        setTimeout(() => {
            res.innerHTML = "<p style='font-size:0.9rem; text-align:justify;'><strong>Note d'analyse :</strong> La conformité de la procédure dépend de la notification formelle. Nous préconisons la vérification des délais de préavis contractuels.</p>";
        }, 1200);
    }

    function generateDoc() {
        const n = document.getElementById('user-name').value;
        if(!n) return alert("Identité requise.");
        html2pdf().from(document.body).save(`3ADALA_CERT_OFFICIEL.pdf`);
    }
</script>
</body>
</html>
