<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3ADALA | Multi-Language Legal Platform</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Montserrat:wght@300;400;600&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --navy: #0a192f; 
            --gold: #b89552; 
            --slate: #455a64; 
            --bg: #ffffff; 
            --nav-height: 75px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: 'Montserrat', sans-serif;
            background: var(--bg); 
            margin: 0; 
            color: var(--navy);
            transition: direction 0.3s ease;
        }

        /* Mode Arabe (Right to Left) */
        body.rtl { direction: rtl; font-family: 'Amiri', serif; }
        body.rtl .sidebar { left: auto; right: 0; border-left: 1px solid rgba(184, 149, 82, 0.3); border-right: none; }
        body.rtl .main-content { margin-left: 0; margin-right: 300px; }
        body.rtl .nav-item i { margin-left: 15px; margin-right: 0; }
        @media (max-width: 768px) {
            body.rtl .main-content { margin-right: 0; }
        }

        /* --- SIDEBAR & LOGO --- */
        .sidebar { background: var(--navy); color: white; position: fixed; z-index: 1000; transition: all 0.3s; }

        @media (min-width: 769px) {
            .sidebar { width: 300px; height: 100vh; padding: 40px 25px; display: flex; flex-direction: column; left: 0; top: 0; }
            .main-content { margin-left: 300px; padding: 60px; min-height: 100vh; display: flex; align-items: center; justify-content: center; transition: all 0.3s; }
        }

        @media (max-width: 768px) {
            .sidebar { bottom: 0; left: 0; width: 100%; height: var(--nav-height); display: flex; justify-content: space-around; align-items: center; }
            .main-content { padding: 20px; padding-bottom: 100px; }
            .logo-container, .lang-selector-container { display: none; }
        }

        .logo-container { text-align: center; margin-bottom: 30px; }
        .logo-main { font-family: 'Cinzel', serif; font-size: 1.4rem; letter-spacing: 4px; color: var(--gold); display: block; }

        /* --- LANGUAGE SELECTOR --- */
        .lang-selector-container { margin-bottom: 30px; }
        .lang-select { 
            width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--gold); 
            color: white; padding: 10px; cursor: pointer; outline: none; font-size: 0.8rem;
        }

        /* --- NAVIGATION --- */
        .nav-item { padding: 15px; margin: 5px 0; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: 0.3s; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; color: #a5b1c2; }
        .nav-item.active { background: rgba(184, 149, 82, 0.1); border-left: 3px solid var(--gold); color: var(--gold); }

        /* --- CONTENT CARDS --- */
        .card { background: #fff; padding: 40px; box-shadow: 0 20px 50px rgba(0,0,0,0.04); border: 1px solid #f0f0f0; width: 100%; max-width: 800px; }
        .tab-content { display: none; animation: fadeIn 0.4s ease; }
        .tab-content.active-section { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        h1, h3 { font-family: 'Cinzel', serif; text-align: center; color: var(--navy); }
        .cta-button { background: var(--navy); color: white; border: 1px solid var(--gold); padding: 18px; width: 100%; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; transition: 0.4s; margin-top: 20px; }
        .cta-button:hover { background: var(--gold); color: var(--navy); }

        input, select, textarea { width: 100%; padding: 15px; margin-bottom: 20px; border: 1px solid #e2e8f0; background: #fafafa; font-family: inherit; }
        label { display: block; margin-bottom: 8px; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; color: var(--gold); letter-spacing: 1px; }

        .header-mobile { display: none; padding: 15px; background: var(--navy); color: var(--gold); text-align: center; font-family: 'Cinzel', serif; }
        @media (max-width: 768px) { .header-mobile { display: block; } }

    </style>
</head>
<body id="body-tag">

    <div class="header-mobile">3ADALA</div>

    <div class="sidebar">
        <div class="logo-container">
            <span class="logo-main">3ADALA</span>
        </div>

        <div class="lang-selector-container">
            <label style="color: #fff; font-size: 0.6rem; margin-bottom: 5px;">Language / Langue / اللغة</label>
            <select class="lang-select" onchange="changeLanguage(this.value)">
                <option value="fr">Français</option>
                <option value="en">English</option>
                <option value="ar">العربية</option>
            </select>
        </div>
        
        <div class="nav-item active" onclick="showTab('tab-home', this)" data-key="nav-home">Accueil</div>
        <div class="nav-item" onclick="showTab('tab-calc', this)" data-key="nav-calc">Simulateur</div>
        <div class="nav-item" onclick="showTab('tab-conseil', this)" data-key="nav-ia">Audit IA</div>
        <div class="nav-item" onclick="showTab('tab-docs', this)" data-key="nav-docs">Documents</div>
    </div>

    <div class="main-content">
        
        <div id="tab-home" class="tab-content active-section">
            <div class="card">
                <h1 data-key="home-title">L'Excellence Juridique</h1>
                <p style="text-align:center; line-height:1.6;" data-key="home-desc">La plateforme digitale dédiée à la démocratisation du Droit du Travail au Maroc.</p>
                <button class="cta-button" onclick="showTab('tab-calc', document.querySelectorAll('.nav-item')[1])" data-key="btn-start">Commencer</button>
            </div>
        </div>

        <div id="tab-calc" class="tab-content">
            <div class="card">
                <h3 data-key="calc-title">Simulateur d'Indemnités</h3>
                <label data-key="label-salary">Salaire Mensuel Net (MAD)</label>
                <input type="number" id="salary" placeholder="...">
                <label data-key="label-years">Ancienneté (Années)</label>
                <input type="number" id="seniority" placeholder="...">
                <button class="cta-button" onclick="calculateRights()" data-key="btn-calc">Calculer</button>
                <div id="res-calc" style="margin-top:20px; padding:20px; border:1px double var(--gold); display:none; text-align:center;"></div>
            </div>
        </div>

        <div id="tab-conseil" class="tab-content">
            <div class="card">
                <h3 data-key="ia-title">Audit Algorithmique</h3>
                <textarea id="ai-question" rows="5" data-key-placeholder="ia-placeholder" placeholder="Décrivez votre situation..."></textarea>
                <button class="cta-button" onclick="askAdvice()" data-key="btn-audit">Analyser</button>
                <div id="res-advice" style="margin-top:20px; padding:20px; background:#f9f9f9; display:none;"></div>
            </div>
        </div>

        <div id="tab-docs" class="tab-content">
            <div class="card">
                <h3 data-key="doc-title">Rapport Officiel</h3>
                <label data-key="label-name">Identité complète</label>
                <input type="text" id="user-name" placeholder="...">
                <button class="cta-button" onclick="generateDoc()" data-key="btn-pdf">Générer PDF</button>
            </div>
        </div>

    </div>

<script>
    const translations = {
        fr: {
            "nav-home": "Accueil", "nav-calc": "Simulateur", "nav-ia": "Audit IA", "nav-docs": "Documents",
            "home-title": "L'Excellence Juridique", "home-desc": "La plateforme digitale dédiée à la démocratisation du Droit du Travail au Maroc.",
            "btn-start": "Commencer", "calc-title": "Simulateur d'Indemnités", "label-salary": "Salaire Mensuel Net (MAD)",
            "label-years": "Ancienneté (Années)", "btn-calc": "Calculer les droits", "ia-title": "Audit Algorithmique",
            "ia-placeholder": "Décrivez votre situation...", "btn-audit": "Lancer l'audit", "doc-title": "Rapport Officiel",
            "label-name": "Identité complète", "btn-pdf": "Générer PDF"
        },
        en: {
            "nav-home": "Home", "nav-calc": "Simulator", "nav-ia": "AI Audit", "nav-docs": "Documents",
            "home-title": "Legal Excellence", "home-desc": "The digital platform dedicated to democratizing Labor Law in Morocco.",
            "btn-start": "Get Started", "calc-title": "Compensation Simulator", "label-salary": "Net Monthly Salary (MAD)",
            "label-years": "Years of Service", "btn-calc": "Calculate Rights", "ia-title": "Algorithmic Audit",
            "ia-placeholder": "Describe your situation...", "btn-audit": "Start Audit", "doc-title": "Official Report",
            "label-name": "Full Identity", "btn-pdf": "Generate PDF"
        },
        ar: {
            "nav-home": "الرئيسية", "nav-calc": "المحاكي", "nav-ia": "تدقيق الذكاء الاصطناعي", "nav-docs": "الوثائق",
            "home-title": "التميز القانوني", "home-desc": "المنصة الرقمية المخصصة لتبسيط قانون الشغل في المغرب.",
            "btn-start": "ابدأ الآن", "calc-title": "محاكي التعويضات", "label-salary": "الراتب الشهري الصافي (درهم)",
            "label-years": "الأقدمية (سنوات)", "btn-calc": "حساب المستحقات", "ia-title": "التدقيق الخوارزمي",
            "ia-placeholder": "صف وضعيتك القانونية...", "btn-audit": "بدء التدقيق", "doc-title": "تقرير رسمي",
            "label-name": "الاسم الكامل", "btn-pdf": "تحميل PDF"
        }
    };

    function changeLanguage(lang) {
        const body = document.getElementById('body-tag');
        if (lang === 'ar') body.classList.add('rtl');
        else body.classList.remove('rtl');

        document.querySelectorAll('[data-key]').forEach(el => {
            el.innerText = translations[lang][el.getAttribute('data-key')];
        });
        
        document.querySelectorAll('[data-key-placeholder]').forEach(el => {
            el.placeholder = translations[lang][el.getAttribute('data-key-placeholder')];
        });
    }

    function showTab(tabId, element) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active-section'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById(tabId).classList.add('active-section');
        if(element) element.classList.add('active');
    }

    function calculateRights() {
        const s = parseFloat(document.getElementById('salary').value);
        const y = parseFloat(document.getElementById('seniority').value);
        const res = document.getElementById('res-calc');
        if(!s || !y) return alert("Data missing");
        const h = s / 191;
        let t = (y <= 5) ? (96*h*y) : (y <= 10) ? (96*h*5 + 144*h*(y-5)) : (96*h*5 + 144*h*5 + 192*h*(y-10));
        res.style.display = "block";
        res.innerHTML = `<strong>${Math.round(t).toLocaleString()} MAD</strong>`;
    }

    function askAdvice() {
        const res = document.getElementById('res-advice');
        res.style.display = "block";
        res.innerHTML = "<em>Analysis in progress...</em>";
        setTimeout(() => { res.innerHTML = "Analyse terminée. Conformité à vérifier selon l'Art. 62."; }, 1000);
    }

    function generateDoc() {
        html2pdf().from(document.body).save(`3ADALA_REPORT.pdf`);
    }
</script>
</body>
</html>
