<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3ADALA | Excellence Juridique Marocaine</title>
    
    <!-- Bibliothèques externes -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Montserrat:wght@300;400;600&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --navy: #0a192f; 
            --gold: #b89552; 
            --slate: #455a64; 
            --bg: #ffffff; 
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: 'Montserrat', sans-serif;
            background: var(--bg); 
            margin: 0; 
            color: var(--navy);
            transition: direction 0.3s ease;
        }

        /* --- LOGIQUE RTL (ARABE) --- */
        body.rtl { direction: rtl; font-family: 'Amiri', serif; }
        body.rtl .sidebar { left: auto; right: 0; border-left: 1px solid rgba(184, 149, 82, 0.3); }
        body.rtl .main-content { margin-left: 0; margin-right: 300px; }
        body.rtl .nav-item i { margin-left: 12px; margin-right: 0; }
        body.rtl .lang-selector-container { right: auto; left: 20px; }

        /* --- LANG SELECTOR (HAUT DROITE) --- */
        .lang-selector-container {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 2000;
        }
        .lang-select { 
            background: white; border: 1px solid var(--gold); color: var(--navy); 
            padding: 8px 15px; cursor: pointer; font-weight: 600; font-size: 0.75rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        /* --- SIDEBAR --- */
        .sidebar { background: var(--navy); color: white; position: fixed; width: 300px; height: 100vh; padding: 40px 25px; left: 0; top: 0; z-index: 1000; }
        .logo-container { text-align: center; margin-bottom: 40px; border-bottom: 1px solid rgba(184, 149, 82, 0.2); padding-bottom: 20px; }
        .logo-main { font-family: 'Cinzel', serif; font-size: 1.5rem; letter-spacing: 5px; color: var(--gold); }

        .nav-item { padding: 16px; margin: 4px 0; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: 0.3s; font-size: 0.8rem; text-transform: uppercase; color: #a5b1c2; }
        .nav-item.active { background: rgba(184, 149, 82, 0.1); border-left: 4px solid var(--gold); color: var(--gold); }

        /* --- CONTENU --- */
        .main-content { margin-left: 300px; padding: 60px; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { background: #fff; padding: 45px; box-shadow: 0 25px 60px rgba(0,0,0,0.05); border: 1px solid #f0f0f0; width: 100%; max-width: 800px; }
        
        .tab-content { display: none; animation: fadeIn 0.5s ease forwards; }
        .tab-content.active-section { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .cta-button { background: var(--navy); color: white; border: 1px solid var(--gold); padding: 18px; width: 100%; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; font-weight: 600; transition: 0.3s; }
        .cta-button:hover { background: var(--gold); color: var(--navy); }

        input, textarea, select { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ddd; font-family: inherit; }
        label { display: block; margin-bottom: 8px; font-size: 0.7rem; font-weight: 600; color: var(--gold); text-transform: uppercase; }

        @media (max-width: 768px) {
            .sidebar { width: 100%; height: 70px; bottom: 0; top: auto; flex-direction: row; padding: 0; justify-content: space-around; }
            .main-content { margin-left: 0; padding: 20px; padding-bottom: 100px; }
            .logo-container { display: none; }
            .nav-item span { display: none; }
        }
    </style>
</head>
<body id="body-tag">

    <div class="lang-selector-container">
        <select class="lang-select" onchange="changeLanguage(this.value)">
            <option value="fr">FR</option>
            <option value="en">EN</option>
            <option value="ar">AR</option>
        </select>
    </div>

    <div class="sidebar">
        <div class="logo-container">
            <span class="logo-main">3ADALA</span>
        </div>
        <div class="nav-item active" onclick="showTab('tab-home', this)" data-key="nav-home">
            <i class="fas fa-home"></i> <span>Accueil</span>
        </div>
        <div class="nav-item" onclick="showTab('tab-calc', this)" data-key="nav-calc">
            <i class="fas fa-calculator"></i> <span>Simulateur</span>
        </div>
        <div class="nav-item" onclick="showTab('tab-conseil', this)" data-key="nav-ia">
            <i class="fas fa-gavel"></i> <span>Audit IA</span>
        </div>
        <div class="nav-item" onclick="showTab('tab-docs', this)" data-key="nav-docs">
            <i class="fas fa-file-invoice"></i> <span>Documents</span>
        </div>
    </div>

    <div class="main-content">
        <!-- ACCUEIL -->
        <div id="tab-home" class="tab-content active-section">
            <div class="card" style="text-align: center;">
                <h1 data-key="home-title">L'Excellence Juridique</h1>
                <p data-key="home-desc" style="color: var(--slate); line-height: 1.6;">La plateforme digitale dédiée à l'accompagnement et à la démocratisation du Droit du Travail au Maroc.</p>
                <button class="cta-button" onclick="showTab('tab-calc', document.querySelectorAll('.nav-item')[1])" data-key="btn-start">Commencer</button>
            </div>
        </div>

        <!-- SIMULATEUR -->
        <div id="tab-calc" class="tab-content">
            <div class="card">
                <h3 data-key="calc-title">Simulateur d'Indemnités</h3>
                <label data-key="label-salary">Salaire Mensuel Net (MAD)</label>
                <input type="number" id="salary" placeholder="8000">
                <label data-key="label-years">Ancienneté (Années)</label>
                <input type="number" id="seniority" placeholder="5">
                <button class="cta-button" onclick="calculateRights()" data-key="btn-calc">Calculer</button>
                <div id="res-calc" style="margin-top:20px; font-size:1.5rem; font-weight:700; color:var(--gold); display:none; text-align:center;"></div>
            </div>
        </div>

        <!-- IA AUDIT -->
        <div id="tab-conseil" class="tab-content">
            <div class="card">
                <h3 data-key="ia-title">Audit Algorithmique</h3>
                <label data-key="ia-placeholder">Description des faits</label>
                <textarea id="ai-question" rows="5" placeholder="Décrivez votre situation..."></textarea>
                <button class="cta-button" onclick="askAdvice()" data-key="btn-audit">Lancer l'audit</button>
                <div id="res-advice" style="margin-top:20px; padding:15px; border-left:3px solid var(--gold); background:#f9f9f9; display:none;"></div>
            </div>
        </div>

        <!-- DOCUMENTS -->
        <div id="tab-docs" class="tab-content">
            <div class="card">
                <h3 data-key="doc-title">Rapport de Synthèse</h3>
                <label data-key="label-name">Nom complet</label>
                <input type="text" id="user-name" placeholder="Votre nom">
                <button class="cta-button" onclick="generateDoc()" data-key="btn-pdf">Générer PDF</button>
            </div>
        </div>
    </div>

    <script>
        const translations = {
            fr: {
                "nav-home": "Accueil", "nav-calc": "Simulateur", "nav-ia": "Audit IA", "nav-docs": "Documents",
                "home-title": "L'Excellence Juridique", "home-desc": "La plateforme digitale dédiée à l'accompagnement et à la démocratisation du Droit du Travail au Maroc.",
                "btn-start": "Commencer", "calc-title": "Simulateur d'Indemnités", "label-salary": "Salaire Mensuel Net (MAD)",
                "label-years": "Ancienneté (Années)", "btn-calc": "Calculer les droits", "ia-title": "Audit Algorithmique",
                "ia-placeholder": "Décrivez votre situation...", "btn-audit": "Lancer l'audit", "doc-title": "Rapport Officiel",
                "label-name": "Identité complète", "btn-pdf": "Générer PDF"
            },
            en: {
                "nav-home": "Home", "nav-calc": "Simulator", "nav-ia": "AI Audit", "nav-docs": "Documents",
                "home-title": "Legal Excellence", "home-desc": "The digital platform dedicated to democratizing Labor Law in Morocco.",
                "btn-start": "Start", "calc-title": "Compensation Simulator", "label-salary": "Net Salary (MAD)",
                "label-years": "Years of Service", "btn-calc": "Calculate", "ia-title": "Algorithmic Audit",
                "ia-placeholder": "Describe your case...", "btn-audit": "Run Audit", "doc-title": "Official Report",
                "label-name": "Full Name", "btn-pdf": "Generate PDF"
            },
            ar: {
                "nav-home": "الرئيسية", "nav-calc": "المحاكي", "nav-ia": "تدقيق الذكاء الاصطناعي", "nav-docs": "الوثائق",
                "home-title": "التميز القانوني", "home-desc": "المنصة الرقمية المخصصة لتبسيط قانون الشغل في المغرب.",
                "btn-start": "ابدأ", "calc-title": "محاكي التعويضات", "label-salary": "الراتب الشهري (درهم)",
                "label-years": "الأقدمية (سنوات)", "btn-calc": "حساب المستحقات", "ia-title": "التدقيق الخوارزمي",
                "ia-placeholder": "صف وضعيتك...", "btn-audit": "بدء التدقيق", "doc-title": "تقرير رسمي",
                "label-name": "الاسم الكامل", "btn-pdf": "تحميل PDF"
            }
        };

        function changeLanguage(lang) {
            const body = document.getElementById('body-tag');
            lang === 'ar' ? body.classList.add('rtl') : body.classList.remove('rtl');
            document.querySelectorAll('[data-key]').forEach(el => {
                const key = el.getAttribute('data-key');
                const icon = el.querySelector('i');
                el.innerHTML = (icon ? icon.outerHTML + ' ' : '') + translations[lang][key];
            });
        }

        function showTab(tabId, element) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active-section'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(tabId).classList.add('active-section');
            if(element) element.classList.add('active');
        }

        function calculateRights() {
            const s = parseFloat(document.getElementById('salary').value);
            const y = parseFloat(document.getElementById('seniority').value);
            const res = document.getElementById('res-calc');
            if(!s || !y) return alert("Remplissez les champs");
            const h = s / 191;
            let t = (y <= 5) ? (96*h*y) : (y <= 10) ? (96*h*5 + 144*h*(y-5)) : (96*h*5 + 144*h*5 + 192*h*(y-10));
            res.style.display = "block";
            res.innerText = Math.round(t).toLocaleString() + " MAD";
        }

        async function askAdvice() {
            const question = document.getElementById('ai-question').value;
            const res = document.getElementById('res-advice');
            if (!question) return alert("Posez une question");
            
            res.style.display = "block";
            res.innerHTML = "<em>Analyse en cours...</em>";

            const HF_TOKEN = "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";
            const MODEL_ID = "mistralai/Mistral-7B-Instruct-v0.2";

            try {
                const response = await fetch(`https://api-inference.huggingface.co/models/${MODEL_ID}`, {
                    headers: { Authorization: `Bearer ${HF_TOKEN}`, "Content-Type": "application/json" },
                    method: "POST",
                    body: JSON.stringify({
                        inputs: `<s>[INST] Tu es un expert en droit du travail marocain. Réponds de façon concise et juridique à : ${question} [/INST]`,
                        parameters: { max_new_tokens: 500, temperature: 0.7 }
                    }),
                });
                const result = await response.json();
                const text = result[0].generated_text.split('[/INST]').pop();
                res.innerHTML = `<strong>Analyse IA :</strong><br>${text}`;
            } catch (e) {
                res.innerHTML = "Erreur de connexion à l'IA.";
            }
        }

        function generateDoc() {
            html2pdf().from(document.body).save('Rapport_3adala.pdf');
        }
    </script>
</body>
</html>
