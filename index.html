<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3ADALA | Excellence Juridique Marocaine</title>
    
    <!-- Bibliothèques externes -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Montserrat:wght@300;400;600&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --navy: #0a192f; 
            --gold: #b89552; 
            --slate: #455a64; 
            --bg: #f8f9fa; 
            --white: #ffffff;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: 'Montserrat', sans-serif;
            background: var(--bg); 
            margin: 0; 
            color: var(--navy);
            transition: all 0.3s ease;
        }

        /* --- LOGIQUE RTL --- */
        body.rtl { direction: rtl; font-family: 'Amiri', serif; }
        body.rtl .sidebar { left: auto; right: 0; border-left: 1px solid rgba(184, 149, 82, 0.3); border-right: none; }
        body.rtl .main-content { margin-left: 0; margin-right: 300px; }
        body.rtl .nav-item i { margin-left: 12px; margin-right: 0; }
        body.rtl .lang-selector-container { right: auto; left: 20px; }

        /* --- UI ELEMENTS --- */
        .lang-selector-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 2000;
        }
        .lang-select { 
            background: var(--white); border: 1px solid var(--gold); color: var(--navy); 
            padding: 8px 15px; cursor: pointer; font-weight: 600; border-radius: 4px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .sidebar { 
            background: var(--navy); color: white; position: fixed; 
            width: 300px; height: 100vh; padding: 40px 0; left: 0; top: 0; z-index: 1000; 
            box-shadow: 4px 0 15px rgba(0,0,0,0.1);
        }
        .logo-container { text-align: center; margin-bottom: 50px; padding: 0 25px 20px; border-bottom: 1px solid rgba(184, 149, 82, 0.2); }
        .logo-main { font-family: 'Cinzel', serif; font-size: 1.8rem; letter-spacing: 5px; color: var(--gold); }

        .nav-item { padding: 18px 30px; margin: 8px 0; display: flex; align-items: center; gap: 15px; cursor: pointer; transition: 0.3s; font-size: 0.85rem; letter-spacing: 1px; color: #a5b1c2; }
        .nav-item:hover { color: var(--gold); background: rgba(184, 149, 82, 0.05); }
        .nav-item.active { background: rgba(184, 149, 82, 0.1); border-left: 5px solid var(--gold); color: var(--gold); }

        .main-content { margin-left: 300px; padding: 40px; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { background: var(--white); padding: 50px; border-radius: 8px; box-shadow: 0 15px 35px rgba(0,0,0,0.05); width: 100%; max-width: 850px; }
        
        .tab-content { display: none; }
        .tab-content.active-section { display: block; animation: slideUp 0.4s ease; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .cta-button { 
            background: var(--navy); color: white; border: 1px solid var(--gold); padding: 16px; 
            width: 100%; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; 
            font-weight: 600; transition: 0.4s; border-radius: 4px; margin-top: 10px;
        }
        .cta-button:hover { background: var(--gold); color: var(--navy); transform: translateY(-2px); }
        .cta-button:disabled { background: #ccc; border-color: #ccc; cursor: not-allowed; }

        input, textarea { width: 100%; padding: 14px; margin-bottom: 20px; border: 1px solid #e0e0e0; border-radius: 4px; font-family: inherit; font-size: 1rem; }
        input:focus, textarea:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(184, 149, 82, 0.1); }
        label { display: block; margin-bottom: 10px; font-size: 0.75rem; font-weight: 600; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; }

        .loader { border: 3px solid #f3f3f3; border-top: 3px solid var(--gold); border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display: inline-block; margin-right: 10px; vertical-align: middle; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        @media (max-width: 768px) {
            .sidebar { width: 100%; height: 70px; bottom: 0; top: auto; flex-direction: row; padding: 0; display: flex; justify-content: space-around; align-items: center; }
            .main-content { margin-left: 0; padding: 20px 20px 100px; }
            .logo-container, .nav-item span { display: none; }
            .nav-item { padding: 10px; margin: 0; border: none !important; }
            .lang-selector-container { top: 10px; right: 10px; }
        }
    </style>
</head>
<body id="body-tag">

    <div class="lang-selector-container">
        <select class="lang-select" onchange="changeLanguage(this.value)">
            <option value="fr">FR</option>
            <option value="en">EN</option>
            <option value="ar">AR</option>
        </select>
    </div>

    <div class="sidebar">
        <div class="logo-container">
            <span class="logo-main">3ADALA</span>
        </div>
        <div class="nav-item active" onclick="showTab('tab-home', this)" data-key="nav-home">
            <i class="fas fa-home"></i> <span>Accueil</span>
        </div>
        <div class="nav-item" onclick="showTab('tab-calc', this)" data-key="nav-calc">
            <i class="fas fa-calculator"></i> <span>Simulateur</span>
        </div>
        <div class="nav-item" onclick="showTab('tab-conseil', this)" data-key="nav-ia">
            <i class="fas fa-robot"></i> <span>Audit IA</span>
        </div>
        <div class="nav-item" onclick="showTab('tab-docs', this)" data-key="nav-docs">
            <i class="fas fa-file-contract"></i> <span>Documents</span>
        </div>
    </div>

    <div class="main-content">
        <!-- ACCUEIL -->
        <div id="tab-home" class="tab-content active-section">
            <div class="card" style="text-align: center;">
                <h1 data-key="home-title">L'Excellence Juridique</h1>
                <p data-key="home-desc" style="color: var(--slate); line-height: 1.8; font-size: 1.1rem; margin-bottom: 30px;">
                    La plateforme digitale dédiée à l'accompagnement et à la démocratisation du Droit du Travail au Maroc.
                </p>
                <button class="cta-button" onclick="showTab('tab-calc', document.querySelectorAll('.nav-item')[1])" data-key="btn-start">Commencer l'expertise</button>
            </div>
        </div>

        <!-- SIMULATEUR -->
        <div id="tab-calc" class="tab-content">
            <div class="card">
                <h3 data-key="calc-title" style="margin-top:0">Simulateur d'Indemnités</h3>
                <label data-key="label-salary">Salaire Mensuel Net (MAD)</label>
                <input type="number" id="salary" placeholder="Ex: 6000">
                <label data-key="label-years">Ancienneté (Années)</label>
                <input type="number" id="seniority" placeholder="Ex: 3">
                <button class="cta-button" onclick="calculateRights()" data-key="btn-calc">Calculer mes droits</button>
                <div id="res-calc" style="margin-top:30px; padding:20px; background:#f0f4f8; border-radius:4px; font-size:1.8rem; font-weight:700; color:var(--navy); display:none; text-align:center;"></div>
            </div>
        </div>

        <!-- IA AUDIT -->
        <div id="tab-conseil" class="tab-content">
            <div class="card">
                <h3 data-key="ia-title" style="margin-top:0">Audit IA Avancé</h3>
                <label data-key="ia-placeholder">Exposez votre litige ou question</label>
                <textarea id="ai-question" rows="6" placeholder="Ex: Mon employeur refuse de me payer mes heures supplémentaires depuis 3 mois..."></textarea>
                <button class="cta-button" id="btn-ia" onclick="askAdvice()" data-key="btn-audit">Démarrer l'analyse</button>
                <div id="res-advice" style="margin-top:25px; padding:20px; border-left:4px solid var(--gold); background:#fcfcfc; display:none; line-height:1.6; white-space: pre-wrap;"></div>
            </div>
        </div>

        <!-- DOCUMENTS -->
        <div id="tab-docs" class="tab-content">
            <div class="card">
                <h3 data-key="doc-title" style="margin-top:0">Génération de Rapport</h3>
                <label data-key="label-name">Nom complet du demandeur</label>
                <input type="text" id="user-name" placeholder="Prénom et Nom">
                <button class="cta-button" onclick="generateDoc()" data-key="btn-pdf">Télécharger le rapport officiel</button>
            </div>
        </div>
    </div>

    <script>
        const translations = {
            fr: {
                "nav-home": "Accueil", "nav-calc": "Simulateur", "nav-ia": "Audit IA", "nav-docs": "Documents",
                "home-title": "L'Excellence Juridique", "home-desc": "La plateforme digitale dédiée à l'accompagnement et à la démocratisation du Droit du Travail au Maroc.",
                "btn-start": "Commencer l'expertise", "calc-title": "Simulateur d'Indemnités", "label-salary": "Salaire Mensuel Net (MAD)",
                "label-years": "Ancienneté (Années)", "btn-calc": "Calculer mes droits", "ia-title": "Audit IA Avancé",
                "ia-placeholder": "Exposez votre litige ou question", "btn-audit": "Démarrer l'analyse", "doc-title": "Rapport de Synthèse",
                "label-name": "Nom complet du demandeur", "btn-pdf": "Télécharger le rapport PDF"
            },
            en: {
                "nav-home": "Home", "nav-calc": "Simulator", "nav-ia": "AI Audit", "nav-docs": "Documents",
                "home-title": "Legal Excellence", "home-desc": "The leading digital platform for Moroccan Labor Law democratization and guidance.",
                "btn-start": "Start Consultation", "calc-title": "Compensation Simulator", "label-salary": "Monthly Net Salary (MAD)",
                "label-years": "Years of Service", "btn-calc": "Calculate Rights", "ia-title": "Advanced AI Audit",
                "ia-placeholder": "Describe your case details", "btn-audit": "Start Analysis", "doc-title": "Summary Report",
                "label-name": "Applicant Full Name", "btn-pdf": "Download PDF Report"
            },
            ar: {
                "nav-home": "الرئيسية", "nav-calc": "المحاكي", "nav-ia": "تدقيق آلي", "nav-docs": "الوثائق",
                "home-title": "التميز القانوني", "home-desc": "المنصة الرقمية الرائدة لتبسيط وتعميم قانون الشغل المغربي.",
                "btn-start": "ابدأ الاستشارة", "calc-title": "محاكي التعويضات", "label-salary": "الراتب الشهري الصافي (درهم)",
                "label-years": "الأقدمية (سنوات)", "btn-calc": "حساب المستحقات", "ia-title": "تدقيق ذكي",
                "ia-placeholder": "اشرح تفاصيل وضعيتك...", "btn-audit": "بدء التحليل", "doc-title": "تقرير ملخص",
                "label-name": "الاسم الكامل", "btn-pdf": "تحميل التقرير"
            }
        };

        function changeLanguage(lang) {
            const body = document.getElementById('body-tag');
            lang === 'ar' ? body.classList.add('rtl') : body.classList.remove('rtl');
            document.querySelectorAll('[data-key]').forEach(el => {
                const key = el.getAttribute('data-key');
                const icon = el.querySelector('i');
                const text = translations[lang][key];
                el.innerHTML = (icon ? icon.outerHTML + ' ' : '') + `<span>${text}</span>`;
            });
        }

        function showTab(tabId, element) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active-section'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(tabId).classList.add('active-section');
            if(element) element.classList.add('active');
        }

        function calculateRights() {
            const s = parseFloat(document.getElementById('salary').value);
            const y = parseFloat(document.getElementById('seniority').value);
            const res = document.getElementById('res-calc');
            if(!s || !y) return alert("Veuillez remplir tous les champs.");
            
            const h = s / 191;
            let t = (y <= 5) ? (96*h*y) : (y <= 10) ? (96*h*5 + 144*h*(y-5)) : (96*h*5 + 144*h*5 + 192*h*(y-10));
            
            res.style.display = "block";
            res.innerHTML = `<small style="font-size:1rem; display:block; color:var(--slate)">Estimation des indemnités :</small>${Math.round(t).toLocaleString()} MAD`;
        }

        async function askAdvice() {
            const btn = document.getElementById('btn-ia');
            const question = document.getElementById('ai-question').value;
            const res = document.getElementById('res-advice');
            
            if (!question || question.length < 10) return alert("Veuillez détailler davantage votre situation.");
            
            btn.disabled = true;
            res.style.display = "block";
            res.innerHTML = '<div class="loader"></div> <em>L\'IA juridique analyse votre demande (ceci peut prendre 20s)...</em>';

            const HF_TOKEN = "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";
            const MODEL_ID = "mistralai/Mistral-7B-Instruct-v0.2";

            try {
                const response = await fetch(`https://api-inference.huggingface.co/models/${MODEL_ID}`, {
                    headers: { Authorization: `Bearer ${HF_TOKEN}`, "Content-Type": "application/json" },
                    method: "POST",
                    body: JSON.stringify({
                        inputs: `<s>[INST] Tu es un expert en droit du travail marocain (Code du travail). Réponds de façon structurée et professionnelle en français à cette question : ${question} [/INST]`,
                        parameters: { max_new_tokens: 600, temperature: 0.7, return_full_text: false }
                    }),
                });

                const result = await response.json();
                
                // Gestion de l'erreur "Model loading" de HuggingFace
                if (result.error && result.error.includes("currently loading")) {
                    res.innerHTML = "<em>Le serveur IA démarre... Veuillez patienter 10 secondes et cliquer à nouveau.</em>";
                    btn.disabled = false;
                    return;
                }

                let text = result[0]?.generated_text || "Désolé, je n'ai pas pu générer de réponse.";
                res.innerHTML = `<strong style="color:var(--gold)">Analyse Algorithmique :</strong><br><br>${text}`;
                
            } catch (e) {
                res.innerHTML = "<strong>Erreur de connexion.</strong> Veuillez vérifier votre connexion internet ou réessayer plus tard.";
            } finally {
                btn.disabled = false;
            }
        }

        function generateDoc() {
            const element = document.body;
            const name = document.getElementById('user-name').value || "Client_Anonyme";
            const opt = {
                margin: 0.5,
                filename: `Rapport_3ADALA_${name}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2 },
                jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
            };
            html2pdf().set(opt).from(element).save();
        }
    </script>
</body>
</html>
