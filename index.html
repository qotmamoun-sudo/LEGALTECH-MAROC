<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3adalapourtous.ma | Excellence Juridique</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { 
            --navy: #1a237e; /* Bleu Marine sérieux */
            --gold: #c5a059; /* Or discret pour le côté premium */
            --slate: #455a64; 
            --bg: #fdfdfd; 
            --white: #ffffff;
            --nav-height: 75px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg); 
            margin: 0; 
            color: #2c3e50;
            letter-spacing: -0.01em;
        }

        /* --- NAVIGATION --- */
        .sidebar { background: var(--navy); color: white; position: fixed; z-index: 1000; box-shadow: 2px 0 10px rgba(0,0,0,0.1); }

        @media (min-width: 769px) {
            .sidebar { width: 280px; height: 100vh; padding: 40px 25px; display: flex; flex-direction: column; left: 0; top: 0; }
            .main-content { margin-left: 280px; padding: 60px; }
            .nav-item { padding: 15px; margin: 10px 0; display: flex; align-items: center; gap: 15px; border-radius: 6px; cursor: pointer; transition: 0.2s; font-weight: 500; }
            .sidebar h2 { font-size: 1.1rem; margin-bottom: 40px; text-align: center; color: var(--gold); letter-spacing: 2px; font-weight: 700; text-transform: uppercase; }
        }

        @media (max-width: 768px) {
            .sidebar { bottom: 0; left: 0; width: 100%; height: var(--nav-height); display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #e0e0e0; background: #fff; color: var(--navy); }
            .sidebar h2 { display: none; }
            .main-content { padding: 25px; padding-bottom: 100px; }
            .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 0.75rem; font-weight: 600; color: #7f8c8d; }
            .nav-item.active { color: var(--navy); }
            .nav-item i { font-size: 1.3rem; margin-bottom: 4px; }
        }

        .nav-item:hover { background: rgba(255,255,255,0.05); }
        .nav-item.active { background: rgba(197, 160, 89, 0.2); border-left: 4px solid var(--gold); }
        @media (max-width: 768px) { .nav-item.active { border-left: none; border-top: 3px solid var(--navy); background: none; } }

        /* --- CONTENU --- */
        .tab-content { display: none; max-width: 750px; margin: 0 auto; animation: fadeIn 0.4s ease; }
        .tab-content.active-section { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .card { 
            background: var(--white); 
            border-radius: 4px; 
            padding: 35px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.03); 
            margin-bottom: 25px;
            border: 1px solid #eee;
        }

        h3 { margin-top: 0; color: var(--navy); font-size: 1.4rem; font-weight: 700; border-bottom: 2px solid var(--gold); display: inline-block; padding-bottom: 8px; margin-bottom: 30px; }

        /* --- FORMULAIRES --- */
        label { display: block; margin-bottom: 10px; font-weight: 700; font-size: 0.85rem; text-transform: uppercase; color: var(--slate); letter-spacing: 0.5px; }
        input, select, textarea { 
            width: 100%; padding: 15px; margin-bottom: 25px; 
            border: 1px solid #dcdde1; border-radius: 0; 
            font-size: 1rem; color: #2f3640;
            background: #fff; transition: border 0.3s;
        }
        input:focus { border-color: var(--navy); outline: none; }

        button { 
            background: var(--navy); color: white; border: none; 
            padding: 18px; border-radius: 0; width: 100%; 
            font-weight: 700; font-size: 0.9rem; cursor: pointer;
            text-transform: uppercase; letter-spacing: 1px;
            transition: 0.3s;
        }
        button:hover { background: #000051; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }

        .result-area { 
            margin-top: 30px; padding: 25px; 
            background: #f8f9fa; border: 1px solid #e0e0e0;
            display: none; text-align: center;
        }

        .header-mobile {
            display: none;
            padding: 20px; text-align: center; background: white;
            font-weight: 700; color: var(--navy); border-bottom: 1px solid #eee;
            letter-spacing: 2px; font-size: 0.9rem;
        }
        @media (max-width: 768px) { .header-mobile { display: block; } }

    </style>
</head>
<body>

    <div class="header-mobile">3ADALAPOURTOUS.MA</div>

    <div class="sidebar">
        <h2>3ADALA</h2>
        <div class="nav-item active" onclick="showTab('tab-calc', this)">
            <i class="fas fa-calculator"></i> <span class="nav-text">SIMULATEUR</span>
        </div>
        <div class="nav-item" onclick="showTab('tab-conseil', this)">
            <i class="fas fa-gavel"></i> <span class="nav-text">ANALYSE IA</span>
        </div>
        <div class="nav-item" onclick="showTab('tab-docs', this)">
            <i class="fas fa-file-alt"></i> <span class="nav-text">DOCUMENTS</span>
        </div>
    </div>

    <div class="main-content">
        <div id="tab-calc" class="tab-content active-section">
            <div class="card">
                <h3>Estimation des Indemnités</h3>
                <label>Rémunération Mensuelle Nette (MAD)</label>
                <input type="number" id="salary" inputmode="numeric" placeholder="Saisissez votre salaire actuel">
                
                <label>Ancienneté Révolue (Années)</label>
                <input type="number" id="seniority" inputmode="numeric" placeholder="Ex: 8">

                <label>Circonstance du départ</label>
                <select id="reason">
                    <option value="licenciement">Rupture à l'initiative de l'employeur</option>
                    <option value="demission">Rupture à l'initiative du salarié</option>
                </select>

                <button onclick="calculateRights()">Lancer la simulation</button>
                <div id="res-calc" class="result-area"></div>
            </div>
        </div>

        <div id="tab-conseil" class="tab-content">
            <div class="card">
                <h3>Audit Juridique Digital</h3>
                <p style="font-size: 0.9rem; color: #7f8c8d; margin-bottom: 25px;">Décrivez les faits de manière précise pour une pré-analyse de conformité.</p>
                <textarea id="ai-question" rows="4" placeholder="Détaillez votre situation ici..."></textarea>
                <button onclick="askAdvice()" style="background:var(--slate);">Générer l'analyse</button>
                <div id="res-advice" class="result-area"></div>
            </div>
        </div>

        <div id="tab-docs" class="tab-content">
            <div class="card">
                <h3>Éditeur de Documents</h3>
                <label>Identité Complète</label>
                <input type="text" id="user-name" placeholder="Nom et Prénom du demandeur">
                <button onclick="generateDoc()">Exporter le rapport officiel (PDF)</button>
            </div>
        </div>
    </div>

<script>
    function showTab(tabId, element) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active-section'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById(tabId).classList.add('active-section');
        element.classList.add('active');
        window.scrollTo(0,0);
    }

    function calculateRights() {
        const s = parseFloat(document.getElementById('salary').value);
        const y = parseFloat(document.getElementById('seniority').value);
        const r = document.getElementById('reason').value;
        const res = document.getElementById('res-calc');

        if(!s || !y) return;

        res.style.display = "block";
        if(r === "demission") {
            res.innerHTML = "<p style='color: #c0392b; font-weight: 700;'>L'indemnité compensatrice n'est pas applicable dans ce cadre.</p>";
        } else {
            const h = s / 191;
            let t = (y <= 5) ? (96*h*y) : (y <= 10) ? (96*h*5 + 144*h*(y-5)) : (96*h*5 + 144*h*5 + 192*h*(y-10));
            res.innerHTML = `Estimation de la compensation : <br><span style="font-size: 1.8rem; color: var(--navy); font-weight: 800;">${Math.round(t).toLocaleString()} DH</span>`;
        }
    }

    function askAdvice() {
        const q = document.getElementById('ai-question').value;
        const res = document.getElementById('res-advice');
        if(!q) return;
        res.style.display = "block";
        res.innerHTML = "<em>Traitement des données en cours...</em>";
        setTimeout(() => {
            res.innerHTML = "<div style='text-align:left;'><strong>Analyse Préliminaire :</strong><br>Votre situation nécessite une vérification de la procédure de notification. Un non-respect des délais légaux pourrait invalider la décision.</div>";
        }, 1200);
    }

    function generateDoc() {
        const n = document.getElementById('user-name').value;
        if(!n) return alert("Veuillez renseigner votre identité.");
        const element = document.body;
        html2pdf().from(element).save(`3ADALA_RAPPORT_${n.toUpperCase()}.pdf`);
    }
</script>
</body>
</html>
